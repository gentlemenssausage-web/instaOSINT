<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>InstaOSINT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --accent:   #7c3aed;
    --accent2:  #06b6d4;
    --danger:   #ef4444;
    --warn:     #f59e0b;
    --ok:       #10b981;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --mono:     'Space Mono', monospace;
    --sans:     'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }

  .logo {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: -1px;
  }
  .logo span { color: var(--accent); }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    background: #1e1e2e;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 4px;
    letter-spacing: 2px;
  }

  /* ── Layout ── */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

  /* ── Config Panel ── */
  .config-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }

  .config-panel .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
  .config-panel label { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; }

  /* ── Search ── */
  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  input, select {
    background: #0d0d14;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 8px;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  input:focus { border-color: var(--accent2); }
  input::placeholder { color: var(--muted); }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    white-space: nowrap;
    transition: background .15s, transform .1s;
  }
  button:hover { background: #6d28d9; }
  button:active { transform: scale(.97); }
  button:disabled { background: #333; cursor: default; }

  .btn-sm {
    padding: 8px 16px;
    font-size: 11px;
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); background: transparent; }

  /* ── Risk Badge ── */
  .risk-block {
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .risk-block.HIGH   { background: rgba(239,68,68,.12);  border: 1px solid #ef4444; }
  .risk-block.MEDIUM { background: rgba(245,158,11,.10); border: 1px solid #f59e0b; }
  .risk-block.LOW    { background: rgba(16,185,129,.10); border: 1px solid #10b981; }

  .risk-score {
    font-family: var(--mono);
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
  }
  .risk-block.HIGH   .risk-score { color: var(--danger); }
  .risk-block.MEDIUM .risk-score { color: var(--warn); }
  .risk-block.LOW    .risk-score { color: var(--ok); }

  .risk-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .risk-level {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .risk-reasons { display: flex; flex-direction: column; gap: 4px; }
  .risk-reason {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .risk-reason::before { content: "▸"; color: var(--warn); }

  /* ── Grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 16px; margin-bottom: 16px; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::before { content: ""; width: 3px; height: 12px; background: var(--accent2); border-radius: 2px; display: inline-block; }

  /* ── Profile Info ── */
  .profile-header { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); flex-shrink: 0; }
  .profile-name { font-size: 18px; font-weight: 700; }
  .profile-handle { font-family: var(--mono); color: var(--accent2); font-size: 13px; margin-bottom: 4px; }
  .profile-bio { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .stats { display: flex; gap: 20px; margin-top: 12px; }
  .stat { text-align: center; }
  .stat-val { font-family: var(--mono); font-size: 18px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    margin: 2px;
  }
  .pill-ok     { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid rgba(16,185,129,.3); }
  .pill-danger { background: rgba(239,68,68,.15);  color: var(--danger); border: 1px solid rgba(239,68,68,.3); }
  .pill-muted  { background: rgba(100,116,139,.15); color: var(--muted); border: 1px solid rgba(100,116,139,.3); }
  .pill-accent { background: rgba(124,58,237,.15); color: var(--accent); border: 1px solid rgba(124,58,237,.3); }

  /* ── URL List ── */
  .url-item {
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-family: var(--mono);
    font-size: 12px;
    word-break: break-all;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .url-item.flagged { border-color: var(--danger); background: rgba(239,68,68,.05); }
  .url-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .url-dot.ok     { background: var(--ok); }
  .url-dot.danger { background: var(--danger); }

  /* ── Platform Grid ── */
  .platform-list { display: flex; flex-direction: column; gap: 8px; }
  .platform-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .platform-row.found { border-color: rgba(6,182,212,.3); }
  .platform-name { font-weight: 600; }
  .platform-link { font-family: var(--mono); font-size: 11px; color: var(--accent2); text-decoration: none; }
  .platform-link:hover { text-decoration: underline; }

  /* ── Domain Card ── */
  .domain-item { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .domain-item:last-child { border-bottom: none; margin-bottom: 0; }
  .domain-name { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent2); margin-bottom: 8px; }
  .domain-meta { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .domain-meta span { display: flex; gap: 8px; }
  .domain-meta strong { color: var(--text); min-width: 100px; }

  /* ── Posts ── */
  .post-item {
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .post-caption { color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .post-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }

  /* ── Loader ── */
  .loader { display: none; text-align: center; padding: 60px; }
  .loader.active { display: block; }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-family: var(--mono); color: var(--muted); font-size: 13px; }

  /* ── Error ── */
  .error-box {
    background: rgba(239,68,68,.1);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 16px;
    color: var(--danger);
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 24px;
  }

  /* ── Empty ── */
  .empty { text-align: center; padding: 40px; color: var(--muted); font-family: var(--mono); font-size: 13px; }

  /* ── Results wrapper ── */
  #results { display: none; }
  #results.show { display: block; }

  /* ── Scrollable ── */
  .scroll-box { max-height: 320px; overflow-y: auto; }
  .scroll-box::-webkit-scrollbar { width: 4px; }
  .scroll-box::-webkit-scrollbar-track { background: transparent; }
  .scroll-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    font-family: var(--mono);
    margin: 20px 0 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">INSTA<span>OSINT</span></div>
  <div class="badge">INTELLIGENCE</div>
</header>

<div class="wrap">

  <!-- Config -->
  <div class="config-panel">
    <div class="field">
      <label>Burner IG Username</label>
      <input type="text" id="igUser" placeholder="your_burner_account"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="igPass" placeholder="••••••••"/>
    </div>
    <button class="btn-sm" onclick="saveConfig()">Connect</button>
    <span id="configStatus" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></span>
  </div>

  <!-- Search -->
  <div class="search-row">
    <input type="text" id="target" placeholder="@username or https://instagram.com/username" style="flex:1;min-width:200px"/>
    <button onclick="runScan()" id="scanBtn">SCAN</button>
  </div>

  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="loader-text" id="loaderText">Connecting to Instagram...</div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox" style="display:none"></div>

  <!-- Results -->
  <div id="results">

    <!-- Risk -->
    <div class="risk-block" id="riskBlock">
      <div>
        <div class="risk-score" id="riskScore">0</div>
        <div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px">RISK SCORE / 100</div>
      </div>
      <div>
        <div class="risk-label">Threat Level</div>
        <div class="risk-level" id="riskLevel">—</div>
        <div class="risk-reasons" id="riskReasons"></div>
      </div>
    </div>

    <!-- Row 1 -->
    <div class="grid">

      <!-- Profile -->
      <div class="card">
        <div class="card-title">Profile</div>
        <div class="profile-header">
          <img class="avatar" id="pfpImg" src="" alt="pfp"/>
          <div>
            <div class="profile-handle" id="profHandle"></div>
            <div class="profile-name" id="profName"></div>
            <div class="tag-row" id="profTags"></div>
          </div>
        </div>
        <div class="profile-bio" id="profBio"></div>
        <div class="stats">
          <div class="stat"><div class="stat-val" id="statPosts">0</div><div class="stat-lbl">Posts</div></div>
          <div class="stat"><div class="stat-val" id="statFollowers">0</div><div class="stat-lbl">Followers</div></div>
          <div class="stat"><div class="stat-val" id="statFollowing">0</div><div class="stat-lbl">Following</div></div>
        </div>
      </div>

      <!-- Cross-Platform -->
      <div class="card">
        <div class="card-title">Cross-Platform Presence</div>
        <div class="platform-list scroll-box" id="platformList"></div>
      </div>

    </div>

    <!-- Row 2 -->
    <div class="grid">

      <!-- URLs -->
      <div class="card">
        <div class="card-title">URLs Found</div>
        <div class="scroll-box" id="urlList">
          <div class="empty">No URLs detected</div>
        </div>
      </div>

      <!-- Domain Analysis -->
      <div class="card">
        <div class="card-title">Domain Analysis</div>
        <div class="scroll-box" id="domainList">
          <div class="empty">No domains to analyze</div>
        </div>
      </div>

    </div>

    <!-- Posts -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Recent Posts</div>
      <div class="scroll-box" id="postList">
        <div class="empty">No posts</div>
      </div>
    </div>

    <!-- Raw JSON -->
    <div class="card">
      <div class="card-title">Raw Data</div>
      <button class="btn-sm btn-secondary" onclick="toggleRaw()">Toggle JSON</button>
      <pre id="rawJson" style="display:none;margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all"></pre>
    </div>

  </div><!-- /results -->
</div>

<script>
const API = "https://instaosint-8fkk.onrender.com";
let rawData = null;

async function saveConfig() {
  const u = document.getElementById("igUser").value.trim();
  const p = document.getElementById("igPass").value.trim();
  if (!u || !p) return;
  document.getElementById("configStatus").textContent = "Connecting...";
  try {
    const r = await fetch(`${API}/config`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ig_user: u, ig_pass: p})
    });
    const d = await r.json();
    document.getElementById("configStatus").textContent = d.status === "ok" ? "✓ Connected" : "✗ Failed";
    document.getElementById("configStatus").style.color = d.status === "ok" ? "var(--ok)" : "var(--danger)";
  } catch {
    document.getElementById("configStatus").textContent = "✗ Server offline — start app.py first";
    document.getElementById("configStatus").style.color = "var(--danger)";
  }
}

function setLoader(msg) {
  document.getElementById("loader").classList.add("active");
  document.getElementById("loaderText").textContent = msg;
}
function hideLoader() { document.getElementById("loader").classList.remove("active"); }

function showError(msg) {
  const el = document.getElementById("errorBox");
  el.style.display = "block";
  el.textContent = "✗ " + msg;
}
function hideError() { document.getElementById("errorBox").style.display = "none"; }

async function runScan() {
  // Wake up Render backend (free tier sleeps after inactivity)
  try { await fetch(`${API}/health`); } catch(_) {}

  const target = document.getElementById("target").value.trim();
  if (!target) return;

  hideError();
  document.getElementById("results").classList.remove("show");
  document.getElementById("scanBtn").disabled = true;

  const steps = [
    "Authenticating with Instagram...",
    "Fetching profile data...",
    "Extracting URLs & domains...",
    "Checking cross-platform presence...",
    "Analyzing domain registrations...",
    "Computing risk score...",
  ];
  let si = 0;
  setLoader(steps[si]);
  const interval = setInterval(() => {
    si = (si + 1) % steps.length;
    document.getElementById("loaderText").textContent = steps[si];
  }, 2200);

  try {
const controller = new AbortController();
const timeout = setTimeout(() => controller.abort(), 1200000);
const r = await fetch(`${API}/scan`, {
  method: "POST",
  headers: {"Content-Type":"application/json"},
  body: JSON.stringify({target}),
  signal: controller.signal
});
clearTimeout(timeout);
    const data = await r.json();
    clearInterval(interval);
    hideLoader();
    document.getElementById("scanBtn").disabled = false;

    if (data.error) { showError(data.error); return; }

    rawData = data;
    renderResults(data);
  } catch(e) {
    clearInterval(interval);
    hideLoader();
    document.getElementById("scanBtn").disabled = false;
    showError("Cannot reach backend. Make sure app.py is running on port 5050.");
  }
}

function renderResults(data) {
  const { profile, flagged_urls, domain_analysis, cross_platform, risk } = data;

  // Risk
  const rb = document.getElementById("riskBlock");
  rb.className = "risk-block " + risk.level;
  document.getElementById("riskScore").textContent = risk.score;
  document.getElementById("riskLevel").textContent = risk.level + " RISK";
  document.getElementById("riskLevel").style.color = risk.level === "HIGH" ? "var(--danger)" : risk.level === "MEDIUM" ? "var(--warn)" : "var(--ok)";
  document.getElementById("riskReasons").innerHTML = (risk.reasons || []).map(r => `<div class="risk-reason">${r}</div>`).join("");

  // Profile
  document.getElementById("pfpImg").src = profile.profile_pic_url || "";
  document.getElementById("profHandle").textContent = "@" + profile.username;
  document.getElementById("profName").textContent = profile.full_name || "";
  document.getElementById("profBio").textContent = profile.bio || "";
  document.getElementById("statPosts").textContent = fmt(profile.post_count);
  document.getElementById("statFollowers").textContent = fmt(profile.followers);
  document.getElementById("statFollowing").textContent = fmt(profile.following);

  const tags = [];
  if (profile.is_verified) tags.push('<span class="pill pill-ok">✓ Verified</span>');
  if (profile.is_private)  tags.push('<span class="pill pill-muted">Private</span>');
  if (profile.is_business) tags.push('<span class="pill pill-accent">Business</span>');
  if (profile.business_category) tags.push(`<span class="pill pill-muted">${profile.business_category}</span>`);
  document.getElementById("profTags").innerHTML = tags.join("");

  // URLs
  const flaggedSet = new Set((flagged_urls || []).map(f => f.url));
  const allUrls = profile.all_urls || [];
  const urlList = document.getElementById("urlList");
  if (allUrls.length === 0) {
    urlList.innerHTML = '<div class="empty">No URLs detected in bio or posts</div>';
  } else {
    urlList.innerHTML = allUrls.map(u => {
      const isFlagged = flaggedSet.has(u);
      const flags = isFlagged ? (flagged_urls.find(f => f.url === u)?.flags || []) : [];
      return `<div class="url-item ${isFlagged ? 'flagged' : ''}">
        <div class="url-dot ${isFlagged ? 'danger' : 'ok'}"></div>
        <div style="flex:1">
          <div>${escHtml(u)}</div>
          ${flags.length ? `<div style="margin-top:4px">${flags.map(f => `<span class="pill pill-danger">${f}</span>`).join('')}</div>` : ''}
        </div>
        <a href="https://www.virustotal.com/gui/url/${encodeURIComponent(u)}/detection" target="_blank" style="font-size:10px;color:var(--muted);text-decoration:none;white-space:nowrap">VT ↗</a>
      </div>`;
    }).join("");
  }

  // Domains
  const domainList = document.getElementById("domainList");
  if (!domain_analysis || domain_analysis.length === 0) {
    domainList.innerHTML = '<div class="empty">No domains analyzed</div>';
  } else {
    domainList.innerHTML = domain_analysis.map(d => {
      const w = d.whois || {};
      const dns = d.dns || {};
      return `<div class="domain-item">
        <div class="domain-name">${escHtml(d.domain)}</div>
        <div class="domain-meta">
          <span><strong>Registrar</strong>${escHtml(w.registrar || "—")}</span>
          <span><strong>Created</strong>${escHtml(w.creation_date || "—")}</span>
          <span><strong>Country</strong>${escHtml(w.country || "—")}</span>
          <span><strong>IP(s)</strong>${escHtml((dns.a_records || []).join(", ") || "—")}</span>
          ${d.urlscan ? `<span><strong>URLScan</strong><a href="${d.urlscan}" target="_blank" style="color:var(--accent2)">View Report ↗</a></span>` : ''}
          <span><strong>VirusTotal</strong><a href="${d.virustotal_url}" target="_blank" style="color:var(--accent2)">Check ↗</a></span>
        </div>
      </div>`;
    }).join("");
  }

  // Platforms
  const platformList = document.getElementById("platformList");
  platformList.innerHTML = Object.entries(cross_platform || {}).map(([name, info]) => {
    const found = info.exists;
    return `<div class="platform-row ${found ? 'found' : ''}">
      <span class="platform-name">${name}</span>
      <div style="display:flex;align-items:center;gap:10px">
        ${found ? `<span class="pill pill-ok">FOUND</span>` : `<span class="pill pill-muted">NOT FOUND</span>`}
        ${found ? `<a class="platform-link" href="${info.url}" target="_blank">${info.url.replace('https://','')}</a>` : ''}
      </div>
    </div>`;
  }).join("");

  // Posts
  const postList = document.getElementById("postList");
  const posts = profile.posts || [];
  if (posts.length === 0) {
    postList.innerHTML = '<div class="empty">No posts retrieved</div>';
  } else {
    postList.innerHTML = posts.map(p => `
      <div class="post-item">
        <div class="post-caption">${escHtml(p.caption || "(no caption)")}</div>
        ${p.urls_found?.length ? `<div style="margin-bottom:6px">${p.urls_found.map(u => `<span class="pill ${flaggedSet.has(u) ? 'pill-danger' : 'pill-muted'}">${escHtml(u.slice(0,40))}${u.length>40?'…':''}</span>`).join('')}</div>` : ''}
        <div class="post-meta">
          <span>❤ ${p.likes}</span>
          <span>💬 ${p.comments}</span>
          <span>${p.timestamp?.slice(0,10) || ''}</span>
        </div>
      </div>`).join("");
  }

  document.getElementById("rawJson").textContent = JSON.stringify(data, null, 2);
  document.getElementById("results").classList.add("show");
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function toggleRaw() {
  const el = document.getElementById("rawJson");
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function fmt(n) {
  if (!n) return "0";
  if (n >= 1000000) return (n/1000000).toFixed(1)+"M";
  if (n >= 1000) return (n/1000).toFixed(1)+"K";
  return n.toString();
}

function escHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') runScan();
});
</script>
</body>
</html>
